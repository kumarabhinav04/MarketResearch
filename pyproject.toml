[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aifactory-research"
version = "0.1.0"
description = "Auditable agentic research platform for ranking public AI-factory growth beneficiaries"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI Factory Research Team"}]
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "certifi>=2024.12.14",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lxml>=5.3,<7",
  "python-dateutil>=2.9,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.30,<1",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]
postgres = ["psycopg[binary,pool]>=3.2,<4"]
production = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "duckdb>=1.2,<2",
  "pgvector>=0.3,<1",
  "polars>=1.22,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "temporalio>=1.9,<2",
]
otel = [
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]

[project.scripts]
aifactory = "aifactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aifactory = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
