services:
  aifactory:
    build: .
    environment:
      AIFACTORY_ENV: production
      AIFACTORY_DB_PATH: /app/artifacts/aifactory.db
      AIFACTORY_CONFIG_DIR: /app/config
      AIFACTORY_REPORT_DIR: /app/artifacts/reports
      AIFACTORY_RAW_SOURCE_DIR: /app/artifacts/raw-sources
      AIFACTORY_API_KEY: ${AIFACTORY_API_KEY:?Set AIFACTORY_API_KEY}
      AIFACTORY_LOG_LEVEL: ${AIFACTORY_LOG_LEVEL:-INFO}
      AIFACTORY_MAX_WORKERS: ${AIFACTORY_MAX_WORKERS:-4}
      AIFACTORY_SEC_USER_AGENT: ${AIFACTORY_SEC_USER_AGENT:?Set AIFACTORY_SEC_USER_AGENT}
      AIFACTORY_MODEL_PROVIDER: ${AIFACTORY_MODEL_PROVIDER:-offline}
      AIFACTORY_MODEL_NAME: ${AIFACTORY_MODEL_NAME:-}
      AIFACTORY_MODEL_BASE_URL: ${AIFACTORY_MODEL_BASE_URL:-http://host.docker.internal:11434}
      AIFACTORY_MODEL_API_KEY: ${AIFACTORY_MODEL_API_KEY:-}
      AIFACTORY_MODEL_TIMEOUT_SECONDS: ${AIFACTORY_MODEL_TIMEOUT_SECONDS:-120}
      AIFACTORY_MODEL_MAX_COMPLETION_TOKENS: ${AIFACTORY_MODEL_MAX_COMPLETION_TOKENS:-800}
      AIFACTORY_MODEL_REASONING_EFFORT: ${AIFACTORY_MODEL_REASONING_EFFORT:-}
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
      EDINET_API_KEY: ${EDINET_API_KEY:-}
      EIA_API_KEY: ${EIA_API_KEY:-}
      PATENTSVIEW_API_KEY: ${PATENTSVIEW_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - aifactory-data:/app/artifacts
    restart: unless-stopped

volumes:
  aifactory-data:
